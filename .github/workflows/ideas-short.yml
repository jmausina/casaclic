name: Ideas virales - fabricar Shorts

# Se lanza al dejar una ficha nueva en ideas/fichas/pendientes/, los miércoles, o a mano.
# Las fichas con "subir_desde" en el futuro esperan a su día.
# Cada Short se sube en PRIVADO; Jose Miguel decide si se publica.
on:
  # Miércoles 10:20 UTC (11:20 en invierno): sube las fichas que el domingo dejó para el miércoles.
  schedule:
    # Todos los días a las 10:20 UTC (11:20 en invierno): sube las fichas que tocan ese día.
    - cron: '20 10 * * *'
    # Repetición de seguridad (GitHub a veces retrasa o salta las ejecuciones programadas). Si ya se subió, no hace nada.
    - cron: '47 14 * * *'
  push:
    paths: ['ideas/fichas/pendientes/*.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = fabricar sin subir'
        required: false
        default: '0'
      solo:
        description: 'Solo las fichas cuyo nombre contenga este texto (vacío = todas)'
        required: false
        default: ''
      forzar:
        description: '1 = fabricar también las fichas de días futuros (solo para revisar, con dry_run=1)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: ideas
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q piper-tts pillow numpy google-api-python-client google-auth requests cryptography
      - name: Fabricar y subir
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHOLLOS_REFRESH_TOKEN: ${{ secrets.YT_CHOLLOS_REFRESH_TOKEN }}
          YT_BELLEZA_REFRESH_TOKEN: ${{ secrets.YT_BELLEZA_REFRESH_TOKEN }}
          YT_CIENCIA_REFRESH_TOKEN: ${{ secrets.YT_CIENCIA_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORZAR: ${{ github.event.inputs.forzar || '0' }}
          OUT_DIR: /tmp/ideas_short
        run: |
          shopt -s nullglob
          fichas=(ideas/fichas/pendientes/*.json)
          [ ${#fichas[@]} -eq 0 ] && { echo "No hay fichas pendientes"; exit 0; }
          for f in "${fichas[@]}"; do
            if [ -n "${{ github.event.inputs.solo }}" ] && [[ "$f" != *"${{ github.event.inputs.solo }}"* ]]; then continue; fi
            python3 ideas/hacer_short.py "$f"
          done
      - name: Guardar el vídeo para revisarlo
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: /tmp/ideas_short/final/*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Guardar fichas
        run: |
          git config user.name "ideas-bot"
          git config user.email "ideas-bot@users.noreply.github.com"
          git add -A ideas/fichas tiktok/token.enc
          git diff --cached --quiet && exit 0
          git commit -m "Ideas: Shorts fabricados $(TZ=Europe/Madrid date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
