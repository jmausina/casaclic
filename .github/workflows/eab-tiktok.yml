name: Estudio Arte y Bisutería - vídeo para TikTok

# Fabrica un vídeo de bisutería y lo manda como BORRADOR a TikTok (@estudioarteybisuteria).
# Jose Miguel abre el aviso de TikTok, copia el texto de https://jmausina.github.io/casaclic/eab/textos.html y pulsa «Publicar».
# El vídeo se guarda en eab/videos/ y se ve en https://jmausina.github.io/casaclic/eab/videos/ (para publicarlo en Instagram).
# Dos turnos al día (mañana y tarde), cada uno con repetición de seguridad. dry_run=1 = no se manda a TikTok (el vídeo sí se guarda).
on:
  schedule:
    - cron: '37 8 * * *'    # 09:37 en España (invierno) · turno de mañana
    - cron: '52 11 * * *'   # repetición de seguridad de la mañana
    - cron: '7 17 * * *'    # 18:07 · turno de tarde
    - cron: '22 19 * * *'   # repetición de seguridad de la tarde (si el turno ya está hecho, no hace nada)
  workflow_dispatch:
    inputs:
      video:
        description: 'Vídeo concreto (id de eab_guiones.json). Vacío = el siguiente de la lista'
        required: false
        default: ''
      dry_run:
        description: '1 = fabricar sin enviar (para revisar)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: eab-tiktok
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q piper-tts pillow numpy requests cryptography
      - name: Fabricar y enviar a TikTok
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          VIDEO: ${{ github.event.inputs.video || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          OUT_DIR: /tmp/eab
        run: python3 tiktok/eab_video.py
      - name: Página de textos para copiar (eab/textos.html)
        run: python3 tiktok/eab_textos.py
      - name: Guardar el vídeo para revisarlo
        uses: actions/upload-artifact@v4
        with:
          name: eab
          path: /tmp/eab/eab_*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Guardar el vídeo (dirección pública para Instagram), el turno y el permiso
        run: |
          git config user.name "eab-bot"
          git config user.email "eab-bot@users.noreply.github.com"
          mkdir -p eab/videos
          cp /tmp/eab/eab_*.mp4 eab/videos/ 2>/dev/null || true
          git add eab/videos/*.mp4 2>/dev/null || true
          for f in tiktok/token_eab.enc tiktok/eab_estado.json eab/textos.html; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "EAB: vídeo $(TZ=Europe/Madrid date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
