name: CasaClic - subir vídeo a YouTube

on:
  schedule:
    # Todos los días a las 09:17 UTC (10:17 en invierno, 11:17 en verano, hora de España).
    # El vídeo se sube antes y YouTube lo publica solo a las 13:00 hora de España.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Número de día (vacío = el que toca hoy)"
        required: false
        default: ""
      privacidad:
        description: "programado (13:00), public, unlisted, private o solo_tiktok"
        required: false
        default: "programado"

permissions:
  contents: write

# Si se lanzan dos a la vez (la programada llega tarde y otra a mano), esperan en fila.
concurrency:
  group: casaclic-youtube
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar si ya se subió el vídeo de hoy
        id: hoy
        run: |
          git pull -q || true
          HOY=$(TZ=Europe/Madrid date +%F)
          if [ -z "${{ github.event.inputs.dia }}" ] && grep -q "^$HOY .*SUBIDO" registro.txt; then
            echo "Ya hay un vídeo de CasaClic subido hoy ($HOY). No subo otro."
            echo "hecho=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.hoy.outputs.hecho != '1'
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        if: steps.hoy.outputs.hecho != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy scipy pillow requests google-api-python-client google-auth cryptography

      - name: Generar y subir el vídeo
        if: steps.hoy.outputs.hecho != '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python casaclic_subir.py "${{ github.event.inputs.dia }}" "${{ github.event.inputs.privacidad }}" | tee salida.txt

      - name: Guardar registro (mantiene activa la tarea diaria)
        if: always() && steps.hoy.outputs.hecho != '1'
        run: |
          echo "$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M') $(grep SUBIDO salida.txt) $(grep -o 'TIKTOK: borrador enviado' salida.txt)" >> registro.txt
          git config user.name "casaclic-bot"
          git config user.email "casaclic-bot@users.noreply.github.com"
          git add registro.txt
          git add tiktok/token.enc 2>/dev/null || true
          git commit -m "Registro de subida $(date +%F)" || exit 0
          git pull --rebase -q || true
          git push
