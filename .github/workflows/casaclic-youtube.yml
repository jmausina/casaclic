name: CasaClic - subir vídeo a YouTube

on:
  schedule:
    # Todos los días a las 09:17 UTC (10:17 en invierno, 11:17 en verano, hora de España).
    # El vídeo se sube antes y YouTube lo publica solo a las 13:00 hora de España.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Número de día (vacío = el que toca hoy)"
        required: false
        default: ""
      privacidad:
        description: "programado (13:00), public, unlisted o private"
        required: false
        default: "programado"

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy scipy pillow requests google-api-python-client google-auth

      - name: Generar y subir el vídeo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python casaclic_subir.py "${{ github.event.inputs.dia }}" "${{ github.event.inputs.privacidad }}" | tee salida.txt

      - name: Guardar registro (mantiene activa la tarea diaria)
        run: |
          echo "$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M') $(grep SUBIDO salida.txt)" >> registro.txt
          git config user.name "casaclic-bot"
          git config user.email "casaclic-bot@users.noreply.github.com"
          git add registro.txt
          git commit -m "Registro de subida $(date +%F)"
          git push
